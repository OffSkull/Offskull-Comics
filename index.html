<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="OffSkull Comics — авторские комиксы"
  >
  <title>OffSkull Comics</title>
  <link rel="stylesheet" href="assets/css/style.css">
  
  <link rel="stylesheet" href="assets/css/admin-entry.css?v=10">
</head>
<body>

  <link
  rel="stylesheet"
  href="assets/css/hero-feature-news.css?v=1"
>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">OFF<span>SKULL</span></a>
    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-label="Открыть меню"
    >☰</button>
<nav class="site-nav">
      <a href="index.html">Главная</a>
      <a href="comic.html">Комиксы</a>
      <a href="characters.html">Персонажи</a>
      <a href="author.html">Об авторе</a>
      <a class="admin-entry-link" href="admin-login.html">
        Вход администратора
      </a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container">
      <div class="hero-card">
        
        <div class="hero-content">
     <aside
  </div>
</aside>     
          <p class="eyebrow">OffSkull Comics</p>
          <h1 id="hero-title">Мир авторских комиксов</h1>
          <p class="lead" id="hero-text"></p>

          <div class="hero-actions">
            <a
              class="button"
              id="hero-read-link"
              href="comic.html"
            >Начать читать</a>

            <a
              class="button button-secondary"
              href="characters.html"
            >Персонажи</a>
          </div>
        </div>
      </div>
    </div>
  </section>
<aside
  class="hero-feature-news"
  id="hero-feature-news"
  aria-label="Главная новость OffSkull Comics"
  hidden
>
  <div class="hero-feature-news-header">
    <span class="hero-feature-news-icon">
      ☠
    </span>

    <strong>
      Новости
    </strong>

    <span class="hero-feature-news-lines"></span>
  </div>

  <div class="hero-feature-news-body">

    <div class="hero-feature-news-cover">
      <img
        id="hero-feature-news-image"
        src="assets/images/banner.svg"
        alt="Обложка нового комикса"
      >
    </div>

    <div class="hero-feature-news-content">

      <span
        class="hero-feature-news-label"
        id="hero-feature-news-label"
      >
        Скоро
      </span>

      <h2 id="hero-feature-news-title">
        Скоро выход комикса
      </h2>

      <div class="hero-feature-news-divider">
        <span></span>
        <b>☠</b>
        <span></span>
      </div>

      <p id="hero-feature-news-text">
        Новая история. Новый герой. Новый мир.
      </p>

      <a
        class="hero-feature-news-button"
        id="hero-feature-news-link"
        href="#"
      >
        <span id="hero-feature-news-button-text">
          Узнать больше
        </span>

        <b>→</b>
      </a>

    </div>
  </div>
</aside>
  <section class="section">
    <div class="container">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Последние публикации</p>
          <h2>Новые комиксы</h2>
        </div>
      </div>

      <div
        class="comics-grid"
        id="featured-comics"
      ></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <strong data-site-name>OffSkull Comics</strong>
    <span>
      © <span data-year></span>
      <span data-author-name>Автор</span>
    </span>
  </div>
</footer>

<script src="assets/js/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=10"></script>
<script src="assets/js/supabase-client.js?v=10"></script>
<script src="assets/js/site-data.js?v=10"></script>
<script src="assets/js/app.js?v=10"></script>
<script src="assets/js/hero-feature-news.js?v=1"></script>
</body>
</html>
