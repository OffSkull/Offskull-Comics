<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Вход администратора — OffSkull Comics</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css?v=10">
</head>
<body class="admin-body admin-login-body">
  <header class="admin-header">
    <div class="container admin-header-inner">
      <a class="logo" href="index.html">OFF<span>SKULL</span></a>
      <a class="button button-secondary button-small" href="index.html">
        ← Вернуться на сайт
      </a>
    </div>
  </header>

  <main class="container admin-login-main">
    <section class="admin-login-card">
      <div class="admin-login-icon">🔐</div>
      <p class="eyebrow">Закрытая зона</p>
      <h1>Вход администратора</h1>
      <p class="admin-login-description">
        Введите логин и пароль администратора. Обычным читателям вход
        не требуется — комиксы и персонажи открыты для просмотра.
      </p>

      <form id="admin-login-form" class="admin-login-form">
        <label>
          <span>Логин</span>
          <input
            id="login-email"
            type="email"
            autocomplete="username"
            placeholder="admin@offskull.ru"
            required
          >
        </label>

        <label>
          <span>Пароль</span>
          <div class="password-row">
            <input
              id="login-password"
              type="password"
              autocomplete="current-password"
              placeholder="Ваш пароль"
              required
            >
            <button
              id="toggle-login-password"
              class="icon-button"
              type="button"
              aria-label="Показать пароль"
            >👁</button>
          </div>
        </label>

        <button class="button admin-login-button" type="submit">
          Войти
        </button>
      </form>

      <div
        class="admin-login-status"
        id="admin-login-status"
        role="status"
        aria-live="polite"
      ></div>

      <p class="admin-security-note">
        Доступ к редактированию проверяется сервером Supabase.
        Пароль не хранится в файлах сайта.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js?v=10"></script>
  <script src="assets/js/supabase-client.js?v=10"></script>
  <script src="assets/js/admin-login.js?v=10"></script>
</body>
</html>
