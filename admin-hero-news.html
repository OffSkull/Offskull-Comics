<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="robots" content="noindex,nofollow">

  <title>Новость на баннере — OffSkull Comics</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css?v=10">

  <style>
    .hero-news-editor {
      padding-top: 50px;
      padding-bottom: 100px;
    }

    .hero-news-editor-card {
      display: grid;
      grid-template-columns: minmax(260px, 390px) minmax(0, 1fr);
      gap: 35px;

      padding: 30px;

      color: #ffffff;
      background: #151519;

      border: 1px solid rgba(246, 197, 20, 0.45);
      border-radius: 18px;
    }

    .hero-news-preview {
      overflow: hidden;
      aspect-ratio: 4 / 5;

      background: #08080a;
      border: 1px solid #f6c514;
      border-radius: 12px;
    }

    .hero-news-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-news-fields {
      display: grid;
      gap: 18px;
    }

    .hero-news-fields label {
      display: grid;
      gap: 8px;

      color: #d2d2d5;
      font-size: 12px;
      font-weight: 800;
    }

    .hero-news-fields input,
    .hero-news-fields textarea {
      box-sizing: border-box;
      width: 100%;

      padding: 13px 14px;

      color: #ffffff;
      background: #09090c;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9px;
    }

    .hero-news-fields textarea {
      min-height: 140px;
      resize: vertical;
    }

    .hero-news-checkbox {
      display: flex !important;
      align-items: center;
      grid-template-columns: auto 1fr !important;
    }

    .hero-news-checkbox input {
      width: 20px;
      height: 20px;
    }

    .hero-news-save-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      margin-top: 28px;
      padding: 20px;

      background: #101014;
      border: 1px solid rgba(246, 197, 20, 0.35);
      border-radius: 13px;
    }

    .hero-news-admin-status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
    }

    .hero-news-admin-status:empty {
      display: none;
    }

    .hero-news-admin-status.busy {
      color: #ffe36d;
      background: rgba(246, 197, 20, 0.12);
    }

    .hero-news-admin-status.success {
      color: #b8ffbe;
      background: rgba(30, 160, 60, 0.15);
    }

    .hero-news-admin-status.error {
      color: #ffaaaa;
      background: rgba(190, 40, 40, 0.15);
    }

    @media (max-width: 800px) {
      .hero-news-editor-card {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .hero-news-save-row {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>

<body class="admin-body">

  <header class="admin-header">
    <div class="container admin-header-inner">

      <a class="logo" href="index.html">
        OFF<span>SKULL</span>
      </a>

      <div class="admin-header-actions">
        <a
          class="button button-secondary button-small"
          href="admin.html"
        >
          ← Основная админка
        </a>

        <a
          class="button button-secondary button-small"
          href="index.html"
        >
          Посмотреть сайт
        </a>

        <button
          class="button button-secondary button-small"
          id="hero-news-logout"
          type="button"
        >
          Выйти
        </button>
      </div>

    </div>
  </header>

  <main class="container hero-news-editor">

    <section class="admin-intro">
      <p class="eyebrow">Главный баннер</p>

      <h1>Новость на баннере</h1>

      <p>
        Здесь можно менять изображение, заголовок,
        описание и ссылку.
      </p>
    </section>

    <section class="hero-news-editor-card">

      <div>
        <div class="hero-news-preview">
          <img
            id="hero-news-preview"
            src="assets/images/banner.svg"
            alt="Предварительный просмотр"
          >
        </div>

        <label
          class="button"
          style="margin-top: 18px; cursor: pointer;"
        >
          Выбрать изображение

          <input
            id="hero-news-image-file"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            hidden
          >
        </label>
      </div>

      <div class="hero-news-fields">

        <label>
          Маленькая надпись

          <input
            id="hero-news-label"
            type="text"
            placeholder="Скоро"
          >
        </label>

        <label>
          Заголовок

          <input
            id="hero-news-title"
            type="text"
            placeholder="Скоро выход комикса"
          >
        </label>

        <label>
          Описание

          <textarea
            id="hero-news-text"
            placeholder="Новая история. Новый герой. Новый мир."
          ></textarea>
        </label>

        <label>
          Ссылка кнопки

          <input
            id="hero-news-link"
            type="text"
            placeholder="comic.html?id=viking"
          >
        </label>

        <label>
          Текст кнопки

          <input
            id="hero-news-button-text"
            type="text"
            placeholder="Узнать больше"
          >
        </label>

        <label class="hero-news-checkbox">
          <input
            id="hero-news-visible"
            type="checkbox"
            checked
          >

          Показывать новость на главной странице
        </label>

      </div>

    </section>

    <section class="hero-news-save-row">
      <div>
        <strong>Опубликовать новость</strong>

        <p>
          После сохранения обновите главную страницу.
        </p>
      </div>

      <button
        class="button"
        id="save-hero-news"
        type="button"
      >
        Сохранить новость
      </button>
    </section>

    <div
      class="hero-news-admin-status"
      id="hero-news-admin-status"
      role="status"
    ></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js?v=10"></script>
  <script src="assets/js/supabase-client.js?v=10"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/admin-core.js?v=10"></script>
  <script src="assets/js/admin-hero-news.js?v=3"></script>

</body>
</html>
