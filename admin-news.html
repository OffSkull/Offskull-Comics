<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="robots" content="noindex,nofollow">

  <title>
    Управление новостями — OffSkull Comics
  </title>

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/admin.css?v=10"
  >

  <style>
    .news-admin-main {
      padding-top: 45px;
      padding-bottom: 120px;
    }

    .news-admin-heading {
      display: flex;

      align-items: flex-end;
      justify-content: space-between;

      gap: 25px;

      margin-bottom: 30px;
    }

    .news-admin-heading h1 {
      margin:
        5px
        0
        10px;
    }

    .news-admin-list {
      display: grid;
      gap: 22px;
    }

    .news-editor-card {
      padding: 25px;

      color: #ffffff;
      background: #151519;

      border:
        1px solid
        rgba(255, 255, 255, 0.13);

      border-radius: 16px;

      box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.3);
    }

    .news-editor-card-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 20px;
    }

    .news-editor-card-header strong {
      color: #f6c514;

      font-size: 13px;
      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    .news-editor-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;
    }

    .news-small-button {
      min-width: 37px;
      min-height: 37px;

      color: #ffffff;
      background: #222228;

      border:
        1px solid
        rgba(255, 255, 255, 0.16);

      border-radius: 8px;

      cursor: pointer;
    }

    .news-delete-button {
      color: #ff8989;

      border-color:
        rgba(255, 95, 95, 0.35);
    }

    .news-editor-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;
    }

    .news-editor-grid label {
      display: grid;
      gap: 8px;

      color: #c9c9cf;

      font-size: 12px;
      font-weight: 800;
    }

    .news-editor-grid input,
    .news-editor-grid textarea {
      width: 100%;
      box-sizing: border-box;

      padding: 13px 14px;

      color: #ffffff;
      background: #0d0d10;

      border:
        1px solid
        rgba(255, 255, 255, 0.16);

      border-radius: 9px;
    }

    .news-editor-grid textarea {
      min-height: 120px;
      resize: vertical;
    }

    .news-full-width {
      grid-column: 1 / -1;
    }

    .news-checkbox {
      display: flex !important;

      align-items: center;

      grid-column: 1 / -1;

      grid-template-columns: auto 1fr !important;
    }

    .news-checkbox input {
      width: 20px;
      height: 20px;
    }

    .news-admin-save {
      position: sticky;
      z-index: 30;
      bottom: 20px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-top: 35px;
      padding: 20px;

      background:
        rgba(12, 12, 15, 0.95);

      border:
        1px solid
        rgba(246, 197, 20, 0.45);

      border-radius: 14px;

      backdrop-filter: blur(12px);
    }

    .news-status {
      margin-top: 20px;
      padding: 15px;

      border-radius: 10px;
    }

    .news-status:empty {
      display: none;
    }

    .news-status.success {
      color: #b8ffba;
      background: rgba(35, 150, 60, 0.16);
    }

    .news-status.error {
      color: #ffaaaa;
      background: rgba(190, 40, 40, 0.16);
    }

    .news-status.busy {
      color: #ffe47b;
      background: rgba(246, 197, 20, 0.12);
    }

    @media (max-width: 750px) {
      .news-admin-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .news-editor-grid {
        grid-template-columns: 1fr;
      }

      .news-full-width,
      .news-checkbox {
        grid-column: auto;
      }

      .news-admin-save {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>

<body class="admin-body">

  <header class="admin-header">
    <div class="container admin-header-inner">

      <a class="logo" href="index.html">
        OFF<span>SKULL</span>
      </a>

      <div class="admin-header-actions">

        <a
          class="button button-secondary button-small"
          href="admin.html"
        >
          ← Основная админка
        </a>

        <a
          class="button button-secondary button-small"
          href="index.html"
        >
          Посмотреть сайт
        </a>

        <button
          class="button button-secondary button-small"
          id="news-admin-logout"
          type="button"
        >
          Выйти
        </button>

      </div>
    </div>
  </header>

  <main class="container news-admin-main">

    <section class="news-admin-heading">

      <div>
        <p class="eyebrow">
          Главная страница
        </p>

        <h1>
          Новости на баннере
        </h1>

        <p>
          Первые четыре опубликованные новости
          появятся справа на главном баннере.
        </p>
      </div>

      <button
        class="button"
        id="add-home-news"
        type="button"
      >
        + Добавить новость
      </button>

    </section>

    <div
      class="news-admin-list"
      id="news-admin-list"
    ></div>

    <section class="news-admin-save">

      <div>
        <strong>
          Опубликовать новости
        </strong>

        <p>
          Изменения сразу станут доступны
          на главной странице.
        </p>
      </div>

      <button
        class="button"
        id="save-home-news"
        type="button"
      >
        Сохранить новости
      </button>

    </section>

    <div
      class="news-status"
      id="news-admin-status"
      role="status"
      aria-live="polite"
    ></div>

  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="assets/js/supabase-config.js?v=10"></script>
  <script src="assets/js/supabase-client.js?v=10"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/admin-core.js?v=10"></script>
  <script src="assets/js/admin-news.js?v=1"></script>

</body>
</html>
